<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memo</title>
</head>
<body>
    <h1>メモアプリ</h1>
    <form action="/" method="POST">
        <input type="text" name="input" placeholder="メモを入力">
        <button type="submit">メモする</button>
    </form>
    <h2>メモ一覧</h2>
    <ul>
        {% for memo in memos %}
            <li>{{ memo }}</li>
        {% endfor %}
    </ul>
</body>
</html>
